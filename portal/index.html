<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WCS Staff Portal</title>
    <link rel="icon" type="image/png" href="/wcs-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <!-- Apply the saved portal appearance before first paint so nobody sees a
         flash of the Classic look (or the fallback accent). Mirrors
         src/lib/theme.js — keep the keys and allowed values in sync. -->
    <script>
      try {
        var d = document.documentElement
        var pick = function (key, allowed, fallback) {
          var v = localStorage.getItem(key)
          return allowed.indexOf(v) >= 0 ? v : fallback
        }
        var t = pick('wcs-portal-theme', ['classic', 'wp', 'spotlight'], 'classic')
        if (t !== 'classic') d.setAttribute('data-theme', t)
        d.setAttribute('data-accent', pick('wcs-portal-accent', ['signal_red', 'deep_red', 'ember', 'steel', 'lime'], 'signal_red'))
        d.setAttribute('data-density', pick('wcs-portal-density', ['comfortable', 'compact'], 'comfortable'))
        d.setAttribute('data-layout', pick('wcs-portal-layout', ['spotlight', 'grid', 'rows'], 'spotlight'))
      } catch (e) {}
    </script>
  </head>
  <body class="bg-bg min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
