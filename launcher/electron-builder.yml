appId: com.westcoaststrength.portal
productName: Portal
directories:
  output: dist
  buildResources: build

# Update + download host. The repos are private, so builds are served from
# Cloudflare R2 via cloudflare/launcher-downloads (see its README).
#
# ORDER MATTERS: electron-builder bakes the FIRST provider into the app's
# resources/app-update.yml, so every build from here on polls R2.
#
# BRIDGE (temporary): the github entry keeps `--publish always` uploading the
# build to GitHub Releases too, so installs still on the old GitHub feed
# (<= 1.7.2) can find one last release, update to it, and switch to R2.
# Delete the github entry once every kiosk reports >= the bridge version.
publish:
  - provider: generic
    url: https://downloads.westcoaststrength.com/portal
  - provider: github
    owner: justinhuttinger
    repo: wcs-staff-portal

# wcsportal:// one-time location deep links. electron-builder registers the
# scheme in the Windows NSIS installer (registry) and the macOS Info.plist.
protocols:
  - name: WCS Portal
    schemes:
      - wcsportal

# ---- Windows ----
win:
  target: nsis
  icon: assets/icon.ico
  # SYSTEM silent updater (same script Action1 runs), registered by
  # installer.nsh customInstall.
  extraResources:
    - from: ../scripts/action1/install-portal.ps1
      to: updater/install-portal.ps1

nsis:
  # No spaces: identical name on GitHub (which would dash them) and on R2,
  # so latest.yml resolves on both feeds during the bridge release.
  artifactName: ${productName}-Setup-${version}.${ext}
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: always
  installerIcon: assets/icon.ico
  include: installer.nsh

# ---- macOS ----
# Universal-style build that produces both Apple Silicon (arm64) and
# Intel (x64) artifacts. We emit dmg (drag-to-Applications installer)
# AND zip (required by electron-updater for delta-style auto-updates
# on macOS). Hardened runtime + entitlements + notarization are
# required for distribution outside the Mac App Store.
mac:
  category: public.app-category.business
  icon: build/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # West Coast Strength Apple Developer team. Public identifier — fine
  # to commit. Notarization activates only when APPLE_ID +
  # APPLE_APP_SPECIFIC_PASSWORD are set in the environment, so local
  # dev builds (without those env vars) won't try to notarize.
  notarize:
    teamId: GVZRM9Z5SM
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64

dmg:
  sign: false
  # Fixed title (no version) so the mounted volume label and any
  # aliases users drag to the Dock or Desktop just say "Portal".
  # The default is "${productName} ${version}", which carries the
  # version into the user's Dock and goes stale across updates.
  title: Portal
