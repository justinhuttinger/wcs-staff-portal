# "WCS ABC" — the ABC-only flavor of the launcher (same codebase as Portal).
# Build:  npm run dist:abc
#
# No portal sign-in: the app opens straight to the ABC Financial tab for the
# kiosk's location (Actions toolbar, Book Day One, VIPs, Cancel Tool,
# post-signup Day One overlay). See src/app-mode.js.
appId: com.westcoaststrength.abc
productName: WCS ABC
directories:
  output: dist
  buildResources: build

# Bakes the flavor into the packaged package.json (read by src/app-mode.js).
# WCS ABC has its own version line, separate from Portal's package.json
# version: bump it here for each ABC release.
extraMetadata:
  wcsAppMode: abc
  version: 0.0.1

# Update feed: private downloads host (see #1014), GitHub as fallback.
# `channel: abc` makes this app read abc.yml, so it can never pick up
# Portal's latest.yml / installer.
publish:
  - provider: generic
    url: https://downloads.westcoaststrength.com/abc
    channel: abc
  - provider: github
    owner: justinhuttinger
    repo: wcs-staff-portal
    channel: abc

# No `protocols`: wcsportal:// deep links belong to the Portal app.

# ---- Windows ----
win:
  target: nsis
  icon: assets/abc-icon.ico

nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: always
  installerIcon: assets/abc-icon.ico
  uninstallerIcon: assets/abc-icon.ico
  # Same kiosk location page -> shared C:\WCS\config.json (skipped if present).
  include: installer.nsh
  artifactName: WCS-ABC-Setup-${version}.${ext}

# ---- macOS ----
mac:
  category: public.app-category.business
  icon: build/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize:
    teamId: GVZRM9Z5SM
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64

dmg:
  sign: false
  title: WCS ABC
