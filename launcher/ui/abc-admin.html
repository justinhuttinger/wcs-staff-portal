<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>WCS ABC Admin</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'">
  <style>
    :root {
      --bg: #f5f5f7;
      --card: #ffffff;
      --text: #1d1d1f;
      --muted: #6e6e73;
      --border: #d2d2d7;
      --hover: #f0f0f5;
      --accent: #007aff;
      --accent-hover: #0066cc;
      --error: #d70015;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1e1e1e;
        --card: #2c2c2e;
        --text: #f5f5f7;
        --muted: #98989d;
        --border: #3a3a3c;
        --hover: #3a3a3c;
        --accent: #0a84ff;
        --accent-hover: #409cff;
        --error: #ff453a;
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      font: 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    .wizard { display: flex; flex-direction: column; height: 100%; }

    .header { padding: 28px 28px 12px; }
    .header h1 { font-size: 18px; font-weight: 600; letter-spacing: -0.2px; margin-bottom: 6px; }
    .header p { font-size: 12px; color: var(--muted); line-height: 1.5; }

    .body { flex: 1; padding: 8px 28px 0; display: flex; flex-direction: column; gap: 14px; }
    label { display: block; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; }
    select, textarea {
      width: 100%;
      font: inherit;
      color: var(--text);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 9px;
    }
    textarea { height: 84px; resize: none; font-family: ui-monospace, Consolas, monospace; font-size: 11px; line-height: 1.45; }
    select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    .hint { font-size: 11px; color: var(--muted); margin-top: 5px; }
    .error { font-size: 12px; color: var(--error); min-height: 16px; }

    .footer {
      padding: 14px 28px 18px;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      border-top: 1px solid var(--border);
    }
    .btn {
      font: inherit;
      padding: 5px 16px;
      border-radius: 6px;
      border: 1px solid transparent;
      cursor: pointer;
      min-width: 80px;
    }
    .btn-secondary { background: var(--card); color: var(--text); border-color: var(--border); }
    .btn-secondary:hover { background: var(--hover); }
    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="wizard">
    <div class="header">
      <h1>WCS ABC Admin</h1>
      <p>Which club this PC's WCS ABC opens and receives calls for.<br>Saving reloads ABC.</p>
    </div>
    <div class="body">
      <div>
        <label for="club">Club</label>
        <select id="club"></select>
      </div>
      <div>
        <label for="url">ABC URL</label>
        <textarea id="url" spellcheck="false"></textarea>
        <div class="hint">Picking a club fills in its default workstation URL. Edit it only if this PC uses a different workstation.</div>
      </div>
      <div class="error" id="error"></div>
    </div>
    <div class="footer">
      <button class="btn btn-secondary" id="cancel">Cancel</button>
      <button class="btn btn-primary" id="save">Save</button>
    </div>
  </div>
  <script src="abc-admin.js"></script>
</body>
</html>
