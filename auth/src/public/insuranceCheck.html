<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Insurance Check</title>
<style>
  /* Brand tokens from the westcoaststrength.com theme (wcs-custom main.css).
     The display font is the site's own, served with Access-Control-Allow-Origin: *. */
  @font-face {
    font-family: "WCSDisplay";
    src: url("https://westcoaststrength.com/wp-content/themes/wcs-custom/assets/fonts/display.woff2") format("woff2");
    font-weight: 400; font-style: normal; font-display: swap;
  }
  :root {
    --text: #16181d;
    --muted: #6b7280;
    --line: #e5e7eb;
    --surface: #f4f4f2;
    --accent: #ff0000;
    --accent-hover: #cc0000;
    --display: "WCSDisplay", Impact, "Arial Narrow", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { background: #fff; }
  body {
    margin: 0; color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .page { max-width: 640px; margin: 0 auto; padding: 36px 20px 48px; }
  .top { display: flex; align-items: center; gap: 16px; margin-bottom: 26px; }
  .logo { width: 64px; height: 64px; flex: none; }
  .eyebrow {
    font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
  }
  h1 {
    font-family: var(--display); font-weight: 400; text-transform: uppercase;
    font-size: 44px; line-height: 1; letter-spacing: .01em; margin: 4px 0 0;
  }
  h1 span { color: var(--accent); }
  .lead { color: var(--muted); margin: 0 0 18px; font-size: 14px; }
  .list { display: grid; gap: 12px; }
  .prog {
    display: flex; align-items: center; gap: 16px;
    border: 1px solid var(--line); border-radius: 12px; padding: 18px 18px 18px 22px; background: #fff;
    border-left: 5px solid var(--text);
  }
  .prog .nm {
    flex: 1; min-width: 0;
    font-family: var(--display); font-weight: 400; text-transform: uppercase;
    font-size: 24px; line-height: 1.1; letter-spacing: .01em;
  }
  .btn {
    flex: none; display: inline-flex; align-items: center; gap: 8px;
    background: var(--accent); color: #fff; text-decoration: none;
    border-radius: 9px; padding: 12px 18px; font-weight: 700; font-size: 14px;
  }
  .btn:hover { background: var(--accent-hover); }
  .btn:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }
  .empty, .err {
    background: var(--surface); border-radius: 12px; padding: 22px; color: var(--muted); font-size: 14px;
  }
  .err { color: #b42318; }
  .clubs { display: grid; gap: 9px; }
  .clubs a {
    display: block; border: 1px solid var(--line); border-radius: 10px; padding: 13px 16px;
    color: var(--text); text-decoration: none; font-weight: 600;
  }
  .clubs a:hover { background: var(--surface); }
  .hide { display: none !important; }
  @media (max-width: 520px) {
    h1 { font-size: 36px; }
    .prog { flex-direction: column; align-items: stretch; gap: 12px; }
    .btn { justify-content: center; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="top">
    <img class="logo" src="{{WIDGET_BASE}}/logo.png" width="64" height="64" alt="West Coast Strength">
    <div>
      <div class="eyebrow" id="eyebrow">Front desk</div>
      <h1>Insurance <span>check</span></h1>
    </div>
  </div>

  <div id="club-view" class="hide">
    <p class="lead">Pick the member's insurance program to check their eligibility.</p>
    <div class="list" id="list"></div>
  </div>

  <div id="pick-view" class="hide">
    <p class="lead">Pick a club.</p>
    <div class="clubs" id="clubs"></div>
  </div>

  <div class="err hide" id="err"></div>
</div>

<script>
(function () {
  'use strict'
  var API = '{{WIDGET_BASE}}'
  var CLUB = '{{WIDGET_LOCATION}}'
  var $ = function (id) { return document.getElementById(id) }
  function show(el, on) { el.classList.toggle('hide', !on) }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;') }
  function fail(msg) { $('err').textContent = msg; show($('err'), true) }

  function get(path) {
    return fetch(API + path).then(function (r) {
      return r.json().catch(function () { return {} }).then(function (b) {
        if (!r.ok) throw new Error(b.error || ('HTTP ' + r.status))
        return b
      })
    })
  }

  var ARROW = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg>'

  if (!CLUB) {
    get('/api/locations').then(function (d) {
      $('clubs').innerHTML = (d.locations || []).map(function (l) {
        return '<a href="' + esc(API + '/' + l.slug) + '">' + esc(l.name) + '</a>'
      }).join('')
      show($('pick-view'), true)
    }).catch(function (e) { fail(e.message) })
    return
  }

  get('/api/programs?club=' + encodeURIComponent(CLUB)).then(function (d) {
    $('eyebrow').textContent = 'Front desk / ' + d.club.name
    document.title = 'Insurance Check - ' + d.club.name
    var programs = d.programs || []
    if (!programs.length) {
      $('list').innerHTML = '<div class="empty">No insurance programs are set up for ' + esc(d.club.name) +
        '. An admin can turn them on in the portal under Admin, Insurance Programs.</div>'
    } else {
      $('list').innerHTML = programs.map(function (p) {
        return '<div class="prog"><div class="nm">' + esc(p.name) + '</div>' +
          '<a class="btn" href="' + esc(p.url) + '" target="_blank" rel="noopener">Check eligibility ' + ARROW + '</a></div>'
      }).join('')
    }
    show($('club-view'), true)
  }).catch(function (e) { fail(e.message) })
})()
</script>
</body>
</html>
