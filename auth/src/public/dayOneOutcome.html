  :root {
    --red: #ff0000;
    --red-hover: #cc0000;
    --ink: #16181d;
    --muted: rgb(22 24 29 / 0.66);
    --line: rgb(0 0 0 / 0.12);
    --field: #f1f1f1;
    --page: #ffffff;
    --display: 'WCSDisplay', 'Arial Narrow', 'Inter', sans-serif;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; overflow-x: hidden; }
  body {
    background: var(--page);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
      Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .page { display: flex; justify-content: center; padding: 40px 20px 64px; }
  /* Embedded in the portal's own modal, the page chrome is the host's job. */
  body.embed .page { padding: 4px 0 12px; }
  body.embed .wordmark { display: none; }
  body.embed .form-title { font-size: 26px; }
  main { width: 100%; max-width: 620px; }

  .wordmark { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
  .wordmark-bar { display: block; width: 5px; height: 18px; background: var(--red); }
  .wordmark-text {
    font-family: var(--display); font-weight: 800; font-size: 13px;
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink);
  }

  .form-title, .state-title, .field-header {
    font-family: var(--display); font-style: normal; font-weight: 900;
    text-transform: uppercase; letter-spacing: 0.01em; line-height: 1.05;
    color: var(--ink); margin: 0;
  }
  .form-title { font-size: 34px; }
  .state-title { font-size: 30px; margin-bottom: 10px; }
  .field-header { font-size: 19px; margin-bottom: 10px; }

  .form-head { margin-bottom: 26px; }
  .form-meta {
    margin: 10px 0 0; font-size: 12px; font-weight: 700;
    letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
  }
  .state-text { margin: 10px 0 0; font-size: 15px; line-height: 1.5; color: var(--muted); }

  /* Booking notes, styled as the renderer's notice block. */
  .notice {
    margin: 16px 0 0; padding: 12px 14px; font-size: 14px; line-height: 1.5;
    background: var(--field); border-left: 3px solid var(--red);
    color: var(--ink); white-space: pre-wrap;
  }

  /* An answered question: label, answer, and a way back to it. */
  .answered {
    display: grid; grid-template-columns: minmax(0, 1fr) auto;
    gap: 2px 14px; align-items: center;
    padding: 12px 14px; margin-bottom: 10px;
    background: var(--field); border-left: 3px solid var(--line);
  }
  .answered .q {
    grid-column: 1; grid-row: 1;
    font-size: 12px; font-weight: 700; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--muted);
  }
  .answered .a {
    grid-column: 1; grid-row: 2;
    font-size: 15px; font-weight: 700; line-height: 1.35; overflow-wrap: anywhere;
  }
  .answered .change {
    grid-column: 2; grid-row: 1 / span 2;
    appearance: none; border: 0; background: none; cursor: pointer;
    font-family: var(--display); font-style: normal; font-weight: 900;
    font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--red); padding: 6px 2px; white-space: nowrap;
  }
  .answered .change:hover { color: var(--red-hover); text-decoration: underline; }

  .field { margin-bottom: 18px; }
  .choice-group { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }

  /* Tap targets rather than radios: this gets filled in one-handed on a gym floor. */
  button.choice {
    appearance: none; font: inherit; text-align: left; cursor: pointer;
    width: 100%; padding: 13px 14px;
    background: var(--field); color: var(--ink);
    border: 1px solid var(--line); border-radius: 0;
    font-size: 15px; overflow-wrap: anywhere;
    transition: border-color .12s, background .12s;
  }
  button.choice:hover { border-color: var(--ink); }
  button.choice .hint {
    display: block; margin-top: 3px; font-size: 12px; color: var(--muted);
  }

  .input {
    width: 100%; padding: 12px; font: inherit; font-size: 16px;
    color: var(--ink); background: var(--field);
    border: 1px solid var(--line); border-radius: 0;
    resize: vertical; line-height: 1.5; min-height: 130px;
  }
  .input:focus { outline: none; border-color: var(--ink); }

  .btn {
    margin-top: 22px; padding: 13px 34px;
    font-family: var(--display); font-style: normal; font-weight: 900;
    font-size: 15px; letter-spacing: 0.06em; text-transform: uppercase;
    color: #fff; background: var(--red);
    border: 1px solid transparent; border-radius: 0; cursor: pointer;
  }
  .btn:hover:not(:disabled) { background: var(--red-hover); }
  .btn:disabled { opacity: 0.55; cursor: default; }

  .form-error {
    margin: 16px 0 0; font-size: 12px; font-weight: 700;
    letter-spacing: 0.04em; text-transform: uppercase; color: var(--red);
  }

  .btn:focus-visible, .input:focus-visible, button.choice:focus-visible,
  .answered .change:focus-visible {
    outline: 2px solid var(--red); outline-offset: 2px;
  }

  @media (max-width: 480px) {
    .page { padding: 28px 16px 48px; }
    .form-title { font-size: 28px; }
    .btn { padding: 13px 26px; width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="page">
  <main id="main">
    <header class="wordmark">
      <span class="wordmark-bar"></span>
      <span class="wordmark-text">WEST COAST STRENGTH</span>
    </header>
    <div id="view"><p class="state-text">Loading this Day One...</p></div>
  </main>
</div>

<script>
(function () {
  var BASE = '{{FORM_BASE}}';
  var main = document.getElementById('main');

  // The wordmark is part of the page shell, not of any screen, so every render
  // paints into #view instead of clearing main and taking the brand with it.
  // The loading message lives inside it too, or it would survive every render.
  var view = document.getElementById('view');
  function clear() { view.innerHTML = ''; }
  var params = new URLSearchParams(location.search);
  // The link only ever carries the contact id. `c` is the documented parameter;
  // contactId is accepted too so an older workflow link keeps working.
  var contactId = (params.get('c') || params.get('contactId') || '').trim();
  // The portal embeds this in its own modal, which already carries the branding
  // and the member's name, so the page drops its chrome and reports completion
  // to the host instead of showing its own end screen.
  var embedded = params.get('embed') === '1';
  if (embedded) document.body.className = 'embed';

  var appt = null;    // the Day One being recorded
  var opts = null;    // option lists from the server
  var answers = {};   // step key -> chosen value

  if (!contactId) return fail('This link is missing its contact id. Ask a manager to resend it.');

  fetch(BASE + '/api/appointment?c=' + encodeURIComponent(contactId))
    .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
    .then(function (res) {
      if (!res.ok) throw new Error(res.j && res.j.error || 'Could not load this Day One');
      opts = res.j.options;
      if (!res.j.appointments || !res.j.appointments.length) return alreadyDone(res.j);
      if (res.j.appointments.length > 1) return choose(res.j.appointments);
      start(res.j.appointments[0]);
    })
    .catch(function (e) { fail(e.message); });

  // --- the question chain ---------------------------------------------------
  //
  // Each step declares when it applies, so the flow is data rather than a pile
  // of show/hide calls. Answering one re-renders: answered questions collapse to
  // a one-line summary, and only the next unanswered one is open.
  function steps() {
    var list = [{
      key: 'status',
      q: 'What happened?',
      choices: [
        ['completed',   'They showed up', 'Ran the session'],
        ['no_show',     'No show',        'Did not come in'],
        ['cancelled',   'Cancelled',      'Called off, not rebooked'],
        ['rescheduled', 'Rescheduled',    'Moved to another time']
      ]
    }];

    if (answers.status === 'completed') {
      list.push({
        key: 'outcome', q: 'Did they buy?',
        choices: [['Sale', 'Sale', ''], ['No Sale', 'No sale', '']]
      });
      if (answers.outcome === 'Sale') {
        list.push({ key: 'pt_sale_type', q: 'What did they buy?', choices: pairs(opts.pt_sale_types) });
      } else if (answers.outcome === 'No Sale') {
        list.push({ key: 'why_no_sale', q: 'Why was it a no sale?', choices: pairs(opts.no_sale_reasons) });
        if (answers.why_no_sale === 'Other') {
          list.push({ key: 'why_no_sale_other', q: 'Tell us more', text: true });
        }
      }
    } else if (answers.status === 'cancelled') {
      // Optional, so it carries its own way past. Forcing a reason pushes people
      // toward whichever option clears the form fastest.
      list.push({
        key: 'cancel_reason', q: 'Why was it cancelled?',
        choices: pairs(opts.cancel_reasons).concat([['', 'Not sure', '']])
      });
    }
    return list;
  }

  function pairs(values) {
    return (values || []).map(function (v) { return [v, v, '']; });
  }

  // Complete once every step in the current chain has an answer. An empty string
  // counts: "Not sure" is a real answer to an optional question.
  function complete() {
    return steps().every(function (s) { return answers[s.key] !== undefined; });
  }

  function start(a) {
    appt = a;
    answers = {};
    render();
  }

  function render() {
    clear();
    reportHeight();
    view.appendChild(headerBlock());

    var card = el('div', 'fields');
    var opened = false;

    steps().forEach(function (s, i) {
      if (answers[s.key] !== undefined) return card.appendChild(collapsed(s, i));
      // Only the first unanswered question is expanded, so the trainer sees one
      // question at a time rather than every option at once.
      if (opened) return;
      opened = true;
      card.appendChild(expanded(s));
    });

    if (!opened && complete()) {
      var err = el('p', 'form-error', '');
      err.id = 'err';
      err.hidden = true;
      card.appendChild(err);

      var go = el('button', 'btn', 'Submit Result');
      go.type = 'button';
      go.id = 'go';
      go.onclick = submit;
      card.appendChild(go);
    }
    view.appendChild(card);
  }

  // An answered question: the question, the answer, and a way back to it.
  function collapsed(s, i) {
    var row = el('div', 'answered');
    row.appendChild(el('span', 'q', s.q));
    row.appendChild(el('span', 'a', label(s, answers[s.key])));
    var change = el('button', 'change', 'Change');
    change.type = 'button';
    change.setAttribute('aria-label', 'Change your answer to: ' + s.q);
    change.onclick = function () {
      // Reopening a question invalidates everything that followed from it.
      // Switching Sale to No Sale must not keep the package picked under the
      // old answer.
      steps().slice(i).forEach(function (later) { delete answers[later.key]; });
      render();
    };
    row.appendChild(change);
    return row;
  }

  function label(s, v) {
    if (s.text) return v || '(blank)';
    if (v === '') return 'Not sure';
    var hit = (s.choices || []).filter(function (c) { return c[0] === v; })[0];
    return hit ? hit[1] : v;
  }

  function expanded(s) {
    var wrap = el('div', 'field');
    wrap.appendChild(el('h2', 'field-header', s.q));

    if (s.text) {
      var ta = el('textarea', 'input');
      ta.id = 'freetext';
      ta.placeholder = 'A short note is plenty';
      ta.maxLength = 500;
      wrap.appendChild(ta);
      var save = el('button', 'btn', 'Continue');
      save.type = 'button';
      save.onclick = function () {
        var v = ta.value.trim();
        if (!v) return;
        answers[s.key] = v;
        render();
      };
      wrap.appendChild(save);
      setTimeout(function () { ta.focus(); }, 0);
      return wrap;
    }

    var grid = el('div', 'choice-group');
    s.choices.forEach(function (c) {
      var b = el('button', 'choice', '');
      b.type = 'button';
      b.innerHTML = esc(c[1]) + (c[2] ? '<span class="hint">' + esc(c[2]) + '</span>' : '');
      b.onclick = function () { answers[s.key] = c[0]; render(); };
      grid.appendChild(b);
    });
    wrap.appendChild(grid);
    return wrap;
  }

  function headerBlock() {
    var head = el('div', 'form-head');
    head.appendChild(el('h1', 'form-title', appt.contact_name || 'Day One Result'));
    head.appendChild(el('p', 'form-meta',
      when(appt) + (appt.trainer_name ? ' · ' + appt.trainer_name : '')));
    if (appt.notes_for_trainer) head.appendChild(el('div', 'notice', appt.notes_for_trainer));
    return head;
  }

  function submit() {
    var body = {
      appointment_id: appt.id,
      status: answers.status,
      outcome: answers.outcome || null,
      pt_sale_type: answers.pt_sale_type || null,
      why_no_sale: answers.why_no_sale || null,
      why_no_sale_other: answers.why_no_sale_other || null,
      cancel_reason: answers.cancel_reason || null
    };
    var btn = document.getElementById('go');
    btn.disabled = true;
    btn.textContent = 'Saving...';
    error('');
    fetch(BASE + '/api/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (!res.ok) throw new Error(res.j && res.j.error || 'Could not save');
        done();
      })
      .catch(function (e) {
        error(e.message);
        btn.disabled = false;
        btn.textContent = 'Submit';
      });
  }

  // --- terminal screens -----------------------------------------------------

  function fail(msg) {
    clear();
    view.appendChild(el('h1', 'state-title', 'Something is missing'));
    view.appendChild(el('p', 'state-text', msg));
  }

  function done() {
    if (embedded) {
      // Same-origin is not guaranteed (the portal is a different host), so the
      // host filters on the message shape rather than us naming a target.
      try { window.parent.postMessage({ type: 'day-one-outcome-recorded' }, '*'); } catch (e) {}
    }
    clear();
    view.appendChild(el('h1', 'state-title', 'Result recorded'));
    view.appendChild(el('p', 'state-text', embedded
      ? 'Saved.'
      : 'Thanks. You can close this page.'));
    reportHeight();
  }

  function alreadyDone(data) {
    var d = data.recorded && data.recorded[0];
    clear();
    view.appendChild(el('h1', 'state-title', 'Nothing left to record'));
    view.appendChild(el('p', 'state-text', d
      ? 'This Day One has already been recorded.'
      : 'There is no open Day One for this member.'));
    reportHeight();
  }

  // Two open Day Ones for one member is rare but real, and it is exactly the
  // case the old custom fields could not express at all. Ask rather than guess.
  function choose(list) {
    clear();
    var box = el('div', 'field');
    box.appendChild(el('h1', 'field-header', 'Which Day One are you recording?'));
    list.forEach(function (a) {
      var b = el('button', 'choice', '');
      b.type = 'button';
      b.style.marginBottom = '8px';
      b.innerHTML = '<strong>' + esc(a.contact_name || 'This member') + '</strong>'
        + '<span class="hint">' + esc(when(a)) + (a.trainer_name ? ' with ' + esc(a.trainer_name) : '') + '</span>';
      b.onclick = function () { start(a); };
      box.appendChild(b);
    });
    view.appendChild(box);
  }

  // The form's height changes with every step, and an iframe cannot size itself.
  // Without this the host has to guess, and a percentage height inside a
  // min-height-only parent silently collapses to 150px.
  function reportHeight() {
    if (!embedded) return;
    setTimeout(function () {
      try {
        window.parent.postMessage({
          type: 'day-one-outcome-height',
          height: document.documentElement.scrollHeight
        }, '*');
      } catch (e) {}
    }, 0);
  }

  // --- helpers --------------------------------------------------------------

  function when(a) {
    var raw = a.scheduled_start || a.scheduled_date;
    if (!raw) return 'Date unknown';
    var d = new Date(a.scheduled_start ? raw : raw + 'T12:00:00Z');
    if (isNaN(d.getTime())) return 'Date unknown';
    var o = { weekday: 'short', month: 'short', day: 'numeric', timeZone: 'America/Los_Angeles' };
    if (a.scheduled_start) { o.hour = 'numeric'; o.minute = '2-digit'; }
    return d.toLocaleString('en-US', o);
  }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text) n.textContent = text;
    return n;
  }
  function error(msg) {
    var n = document.getElementById('err');
    if (!n) return;
    n.textContent = msg || '';
    n.hidden = !msg;
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
})();
</script>
</body>
</html>
