<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Day One Result</title>
<style>
  :root {
    --red: #c8102e;
    --ink: #14161a;
    --muted: #6b7280;
    --line: #e3e6ea;
    --bg: #f5f6f8;
    --card: #ffffff;
    --ok: #16794c;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 0 0 48px;
  }
  header { background: var(--ink); color: #fff; padding: 18px 20px; }
  header .title { font-size: 18px; font-weight: 700; letter-spacing: .2px; }
  header .sub { font-size: 13px; opacity: .75; margin-top: 2px; }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }
  html, body { overflow-x: hidden; }
  button.choice { overflow-wrap: anywhere; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 18px; margin-bottom: 14px;
  }
  .who { font-size: 20px; font-weight: 700; }
  .when { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .notes {
    margin-top: 12px; padding: 10px 12px; background: #fbfbfc;
    border-left: 3px solid var(--line); border-radius: 0 8px 8px 0;
    font-size: 14px; color: #333; white-space: pre-wrap;
  }

  /* A question already answered, collapsed to just the question and the answer.
     Grid rather than a row: the no-sale reasons run to 45 characters, and on a
     phone a question, that answer and a Change button cannot share one line. */
  .done-row {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1px 12px;
    align-items: center;
    padding: 11px 14px; margin-bottom: 8px;
    background: #fbfbfc; border: 1px solid var(--line); border-radius: 10px;
  }
  .done-row .q {
    grid-column: 1; grid-row: 1;
    font-size: 12.5px; color: var(--muted); line-height: 1.35;
  }
  .done-row .a {
    grid-column: 1; grid-row: 2;
    font-weight: 600; line-height: 1.35;
    overflow-wrap: anywhere;
  }
  .done-row .change {
    grid-column: 2; grid-row: 1 / span 2;
    appearance: none; border: 0; background: none; cursor: pointer;
    font: inherit; font-size: 13px; font-weight: 600; color: var(--red);
    padding: 6px 2px; white-space: nowrap;
  }
  .done-row .change:hover { text-decoration: underline; }

  h2 { font-size: 15px; font-weight: 700; margin: 0 0 10px; }
  .step { margin-bottom: 4px; }
  .choices { display: grid; gap: 10px; }
  .choices.two { grid-template-columns: 1fr 1fr; }
  button.choice {
    appearance: none; font: inherit; text-align: left; cursor: pointer;
    background: #fff; border: 2px solid var(--line); border-radius: 12px;
    padding: 14px 16px; font-weight: 600; color: var(--ink);
    transition: border-color .12s, background .12s;
  }
  button.choice:hover { border-color: #c9ced6; }
  button.choice .hint { display: block; font-weight: 400; font-size: 13px; color: var(--muted); margin-top: 2px; }
  textarea {
    width: 100%; font: inherit; color: var(--ink); background: #fff;
    border: 1px solid var(--line); border-radius: 10px; padding: 12px;
    min-height: 84px; resize: vertical;
  }
  textarea:focus, button:focus-visible { outline: 2px solid var(--red); outline-offset: 1px; }
  .submit {
    appearance: none; font: inherit; font-weight: 700; cursor: pointer; width: 100%;
    background: var(--red); color: #fff; border: 0; border-radius: 12px; padding: 16px;
    font-size: 17px; margin-top: 12px;
  }
  .submit:disabled { background: #c9ced6; cursor: not-allowed; }
  .msg { padding: 14px 16px; border-radius: 12px; font-size: 15px; margin-top: 12px; }
  .msg.err { background: #fff1f2; border: 1px solid #f6c9ce; color: #8a1220; }
  .center { text-align: center; padding: 40px 16px; color: var(--muted); }
  .tick { font-size: 44px; line-height: 1; margin-bottom: 10px; }
  .pick { width: 100%; margin-bottom: 10px; }
</style>
</head>
<body>
<header>
  <div class="title">Day One Result</div>
  <div class="sub">Tell us how the session went</div>
</header>
<main id="main">
  <div class="center">Loading this Day One...</div>
</main>

<script>
(function () {
  var BASE = '{{FORM_BASE}}';
  var main = document.getElementById('main');
  var params = new URLSearchParams(location.search);
  // The link only ever carries the contact id. `c` is the documented parameter;
  // contactId is accepted too so an older workflow link keeps working.
  var contactId = (params.get('c') || params.get('contactId') || '').trim();

  var appt = null;    // the Day One being recorded
  var opts = null;    // option lists from the server
  var answers = {};   // step key -> chosen value

  if (!contactId) return fail('This link is missing its contact id. Ask a manager to resend it.');

  fetch(BASE + '/api/appointment?c=' + encodeURIComponent(contactId))
    .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
    .then(function (res) {
      if (!res.ok) throw new Error(res.j && res.j.error || 'Could not load this Day One');
      opts = res.j.options;
      if (!res.j.appointments || !res.j.appointments.length) return alreadyDone(res.j);
      if (res.j.appointments.length > 1) return choose(res.j.appointments);
      start(res.j.appointments[0]);
    })
    .catch(function (e) { fail(e.message); });

  // --- the question chain ---------------------------------------------------
  //
  // Each step declares when it applies, so the flow is data rather than a pile
  // of show/hide calls. Answering one re-renders: answered questions collapse to
  // a one-line summary, and only the next unanswered one is open.
  function steps() {
    var list = [{
      key: 'status',
      q: 'What happened?',
      choices: [
        ['completed',   'They showed up', 'Ran the session'],
        ['no_show',     'No show',        'Did not come in'],
        ['cancelled',   'Cancelled',      'Called off, not rebooked'],
        ['rescheduled', 'Rescheduled',    'Moved to another time']
      ]
    }];

    if (answers.status === 'completed') {
      list.push({
        key: 'outcome', q: 'Did they buy?',
        choices: [['Sale', 'Sale', ''], ['No Sale', 'No sale', '']]
      });
      if (answers.outcome === 'Sale') {
        list.push({ key: 'pt_sale_type', q: 'What did they buy?', choices: pairs(opts.pt_sale_types) });
      } else if (answers.outcome === 'No Sale') {
        list.push({ key: 'why_no_sale', q: 'Why was it a no sale?', choices: pairs(opts.no_sale_reasons) });
        if (answers.why_no_sale === 'Other') {
          list.push({ key: 'why_no_sale_other', q: 'Tell us more', text: true });
        }
      }
    } else if (answers.status === 'cancelled') {
      // Optional, so it carries its own way past. Forcing a reason pushes people
      // toward whichever option clears the form fastest.
      list.push({
        key: 'cancel_reason', q: 'Why was it cancelled?',
        choices: pairs(opts.cancel_reasons).concat([['', 'Not sure', '']])
      });
    }
    return list;
  }

  function pairs(values) {
    return (values || []).map(function (v) { return [v, v, '']; });
  }

  // Complete once every step in the current chain has an answer. An empty string
  // counts: "Not sure" is a real answer to an optional question.
  function complete() {
    return steps().every(function (s) { return answers[s.key] !== undefined; });
  }

  function start(a) {
    appt = a;
    answers = {};
    render();
  }

  function render() {
    main.innerHTML = '';
    main.appendChild(headerCard());

    var card = el('div', 'card');
    var opened = false;

    steps().forEach(function (s, i) {
      if (answers[s.key] !== undefined) return card.appendChild(collapsed(s, i));
      // Only the first unanswered question is expanded, so the trainer sees one
      // question at a time rather than every option at once.
      if (opened) return;
      opened = true;
      card.appendChild(expanded(s));
    });

    if (!opened && complete()) {
      var err = el('div', 'msg err', '');
      err.id = 'err';
      err.hidden = true;
      card.appendChild(err);

      var go = el('button', 'submit', 'Submit');
      go.type = 'button';
      go.id = 'go';
      go.onclick = submit;
      card.appendChild(go);
    }
    main.appendChild(card);
  }

  // An answered question: the question, the answer, and a way back to it.
  function collapsed(s, i) {
    var row = el('div', 'done-row');
    row.appendChild(el('span', 'q', s.q));
    row.appendChild(el('span', 'a', label(s, answers[s.key])));
    var change = el('button', 'change', 'Change');
    change.type = 'button';
    change.setAttribute('aria-label', 'Change your answer to: ' + s.q);
    change.onclick = function () {
      // Reopening a question invalidates everything that followed from it.
      // Switching Sale to No Sale must not keep the package picked under the
      // old answer.
      steps().slice(i).forEach(function (later) { delete answers[later.key]; });
      render();
    };
    row.appendChild(change);
    return row;
  }

  function label(s, v) {
    if (s.text) return v || '(blank)';
    if (v === '') return 'Not sure';
    var hit = (s.choices || []).filter(function (c) { return c[0] === v; })[0];
    return hit ? hit[1] : v;
  }

  function expanded(s) {
    var wrap = el('div', 'step');
    wrap.appendChild(el('h2', '', s.q));

    if (s.text) {
      var ta = el('textarea');
      ta.id = 'freetext';
      ta.placeholder = 'A short note is plenty';
      ta.maxLength = 500;
      wrap.appendChild(ta);
      var save = el('button', 'submit', 'Continue');
      save.type = 'button';
      save.onclick = function () {
        var v = ta.value.trim();
        if (!v) return;
        answers[s.key] = v;
        render();
      };
      wrap.appendChild(save);
      setTimeout(function () { ta.focus(); }, 0);
      return wrap;
    }

    var grid = el('div', 'choices' + (s.choices.length === 2 ? ' two' : ''));
    s.choices.forEach(function (c) {
      var b = el('button', 'choice', '');
      b.type = 'button';
      b.innerHTML = esc(c[1]) + (c[2] ? '<span class="hint">' + esc(c[2]) + '</span>' : '');
      b.onclick = function () { answers[s.key] = c[0]; render(); };
      grid.appendChild(b);
    });
    wrap.appendChild(grid);
    return wrap;
  }

  function headerCard() {
    var head = el('div', 'card');
    head.appendChild(el('div', 'who', appt.contact_name || 'Day One'));
    head.appendChild(el('div', 'when', when(appt) + (appt.trainer_name ? ' with ' + appt.trainer_name : '')));
    if (appt.notes_for_trainer) head.appendChild(el('div', 'notes', appt.notes_for_trainer));
    return head;
  }

  function submit() {
    var body = {
      appointment_id: appt.id,
      status: answers.status,
      outcome: answers.outcome || null,
      pt_sale_type: answers.pt_sale_type || null,
      why_no_sale: answers.why_no_sale || null,
      why_no_sale_other: answers.why_no_sale_other || null,
      cancel_reason: answers.cancel_reason || null
    };
    var btn = document.getElementById('go');
    btn.disabled = true;
    btn.textContent = 'Saving...';
    error('');
    fetch(BASE + '/api/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (!res.ok) throw new Error(res.j && res.j.error || 'Could not save');
        done();
      })
      .catch(function (e) {
        error(e.message);
        btn.disabled = false;
        btn.textContent = 'Submit';
      });
  }

  // --- terminal screens -----------------------------------------------------

  function fail(msg) {
    main.innerHTML = '';
    main.appendChild(el('div', 'msg err', msg));
  }

  function done() {
    main.innerHTML = '';
    var box = el('div', 'card center');
    box.innerHTML = '<div class="tick" style="color:#16794c">&#10003;</div>'
      + '<div style="font-weight:700;color:#14161a;font-size:18px">Recorded</div>'
      + '<div style="margin-top:6px">Thanks. You can close this page.</div>';
    main.appendChild(box);
  }

  function alreadyDone(data) {
    var d = data.recorded && data.recorded[0];
    main.innerHTML = '';
    var box = el('div', 'card center');
    box.innerHTML = '<div class="tick">&#10003;</div>'
      + '<div style="font-weight:700;color:#14161a">Nothing left to record</div>'
      + '<div style="margin-top:6px">'
      + (d ? 'This Day One was already recorded.' : 'There is no open Day One for this member.')
      + '</div>';
    main.appendChild(box);
  }

  // Two open Day Ones for one member is rare but real, and it is exactly the
  // case the old custom fields could not express at all. Ask rather than guess.
  function choose(list) {
    main.innerHTML = '';
    var box = el('div', 'card');
    box.appendChild(el('h2', '', 'Which Day One are you recording?'));
    list.forEach(function (a) {
      var b = el('button', 'choice pick', '');
      b.type = 'button';
      b.innerHTML = '<strong>' + esc(a.contact_name || 'This member') + '</strong>'
        + '<span class="hint">' + esc(when(a)) + (a.trainer_name ? ' with ' + esc(a.trainer_name) : '') + '</span>';
      b.onclick = function () { start(a); };
      box.appendChild(b);
    });
    main.appendChild(box);
  }

  // --- helpers --------------------------------------------------------------

  function when(a) {
    var raw = a.scheduled_start || a.scheduled_date;
    if (!raw) return 'Date unknown';
    var d = new Date(a.scheduled_start ? raw : raw + 'T12:00:00Z');
    if (isNaN(d.getTime())) return 'Date unknown';
    var o = { weekday: 'short', month: 'short', day: 'numeric', timeZone: 'America/Los_Angeles' };
    if (a.scheduled_start) { o.hour = 'numeric'; o.minute = '2-digit'; }
    return d.toLocaleString('en-US', o);
  }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text) n.textContent = text;
    return n;
  }
  function error(msg) {
    var n = document.getElementById('err');
    if (!n) return;
    n.textContent = msg || '';
    n.hidden = !msg;
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
})();
</script>
</body>
</html>
