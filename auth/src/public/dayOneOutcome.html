<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Day One Result</title>
<style>
  :root {
    --red: #c8102e;
    --ink: #14161a;
    --muted: #6b7280;
    --line: #e3e6ea;
    --bg: #f5f6f8;
    --card: #ffffff;
    --ok: #16794c;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 0 0 48px;
  }
  header { background: var(--ink); color: #fff; padding: 18px 20px; }
  header .title { font-size: 18px; font-weight: 700; letter-spacing: .2px; }
  header .sub { font-size: 13px; opacity: .75; margin-top: 2px; }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 18px; margin-bottom: 14px;
  }
  .who { font-size: 20px; font-weight: 700; }
  .when { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .notes {
    margin-top: 12px; padding: 10px 12px; background: #fbfbfc;
    border-left: 3px solid var(--line); border-radius: 0 8px 8px 0;
    font-size: 14px; color: #333; white-space: pre-wrap;
  }
  h2 { font-size: 15px; font-weight: 700; margin: 0 0 10px; }
  .step { margin-bottom: 20px; }
  .step[hidden] { display: none; }
  .choices { display: grid; gap: 10px; }
  .choices.two { grid-template-columns: 1fr 1fr; }
  button.choice {
    appearance: none; font: inherit; text-align: left; cursor: pointer;
    background: #fff; border: 2px solid var(--line); border-radius: 12px;
    padding: 14px 16px; font-weight: 600; color: var(--ink);
    transition: border-color .12s, background .12s;
  }
  button.choice:hover { border-color: #c9ced6; }
  button.choice[aria-pressed="true"] { border-color: var(--red); background: #fff5f6; }
  button.choice .hint { display: block; font-weight: 400; font-size: 13px; color: var(--muted); margin-top: 2px; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  select, textarea {
    width: 100%; font: inherit; color: var(--ink); background: #fff;
    border: 1px solid var(--line); border-radius: 10px; padding: 12px;
  }
  textarea { min-height: 84px; resize: vertical; }
  select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--red); outline-offset: 1px; }
  .submit {
    appearance: none; font: inherit; font-weight: 700; cursor: pointer; width: 100%;
    background: var(--red); color: #fff; border: 0; border-radius: 12px; padding: 16px;
    font-size: 17px;
  }
  .submit:disabled { background: #c9ced6; cursor: not-allowed; }
  .msg { padding: 14px 16px; border-radius: 12px; font-size: 15px; }
  .msg.err { background: #fff1f2; border: 1px solid #f6c9ce; color: #8a1220; }
  .msg.ok { background: #eefaf3; border: 1px solid #bfe6d2; color: var(--ok); }
  .center { text-align: center; padding: 40px 16px; color: var(--muted); }
  .tick { font-size: 44px; line-height: 1; margin-bottom: 10px; }
  .pick { width: 100%; margin-bottom: 10px; }
</style>
</head>
<body>
<header>
  <div class="title">Day One Result</div>
  <div class="sub">Tell us how the session went</div>
</header>
<main id="main">
  <div class="center" id="loading">Loading this Day One...</div>
</main>

<script>
(function () {
  var BASE = '{{FORM_BASE}}';
  var main = document.getElementById('main');
  var params = new URLSearchParams(location.search);
  // The link only ever carries the contact id. `c` is the documented parameter;
  // contactId is accepted too so an older workflow link keeps working.
  var contactId = (params.get('c') || params.get('contactId') || '').trim();

  var state = { appt: null, data: null, status: null, outcome: null };

  if (!contactId) return fail('This link is missing its contact id. Ask a manager to resend it.');

  fetch(BASE + '/api/appointment?c=' + encodeURIComponent(contactId))
    .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
    .then(function (res) {
      if (!res.ok) throw new Error(res.j && res.j.error || 'Could not load this Day One');
      state.data = res.j;
      if (!res.j.appointments || !res.j.appointments.length) return alreadyDone(res.j);
      if (res.j.appointments.length > 1) return choose(res.j.appointments);
      render(res.j.appointments[0]);
    })
    .catch(function (e) { fail(e.message); });

  function fail(msg) {
    main.innerHTML = '';
    main.appendChild(el('div', 'msg err', msg));
  }

  function alreadyDone(data) {
    var done = data.recorded && data.recorded[0];
    main.innerHTML = '';
    var box = el('div', 'card center');
    box.innerHTML = '<div class="tick">&#10003;</div>'
      + '<div style="font-weight:700;color:#14161a">Nothing left to record</div>'
      + '<div style="margin-top:6px">'
      + (done
          ? 'This Day One was already recorded' + (done.submitted_by ? ' by ' + esc(done.submitted_by) : '') + '.'
          : 'There is no open Day One for this member.')
      + '</div>';
    main.appendChild(box);
  }

  // Two open Day Ones for one member is rare but real, and it is exactly the
  // case the old custom fields could not express at all. Ask rather than guess.
  function choose(list) {
    main.innerHTML = '';
    var box = el('div', 'card');
    box.appendChild(el('h2', '', 'Which Day One are you recording?'));
    list.forEach(function (a) {
      var b = el('button', 'choice pick', '');
      b.type = 'button';
      b.innerHTML = '<strong>' + esc(a.contact_name || 'This member') + '</strong>'
        + '<span class="hint">' + esc(when(a)) + (a.trainer_name ? ' with ' + esc(a.trainer_name) : '') + '</span>';
      b.onclick = function () { render(a); };
      box.appendChild(b);
    });
    main.appendChild(box);
  }

  function when(a) {
    var raw = a.scheduled_start || a.scheduled_date;
    if (!raw) return 'Date unknown';
    var d = new Date(a.scheduled_start ? raw : raw + 'T12:00:00Z');
    if (isNaN(d.getTime())) return 'Date unknown';
    var opts = { weekday: 'short', month: 'short', day: 'numeric', timeZone: 'America/Los_Angeles' };
    if (a.scheduled_start) { opts.hour = 'numeric'; opts.minute = '2-digit'; }
    return d.toLocaleString('en-US', opts);
  }

  function render(appt) {
    state.appt = appt;
    state.status = null;
    state.outcome = null;
    main.innerHTML = '';

    var head = el('div', 'card');
    head.appendChild(el('div', 'who', appt.contact_name || 'Day One'));
    head.appendChild(el('div', 'when', when(appt) + (appt.trainer_name ? ' with ' + appt.trainer_name : '')));
    if (appt.notes_for_trainer) head.appendChild(el('div', 'notes', appt.notes_for_trainer));
    main.appendChild(head);

    var form = el('div', 'card');
    form.id = 'form';
    main.appendChild(form);

    // Step 1. Cancelled and Rescheduled sit alongside show and no-show because a
    // Day One that never happened is not a no-show, and counting it as one is
    // what makes the show rate untrustworthy.
    form.appendChild(step('s-status', 'What happened?', grid([
      ['completed', 'They showed up', 'Ran the session'],
      ['no_show', 'No show', 'Did not come in'],
      ['cancelled', 'Cancelled', 'Called off, not rebooked'],
      ['rescheduled', 'Rescheduled', 'Moved to another time'],
    ], onStatus)));

    form.appendChild(step('s-sale', 'Did they buy?', grid([
      ['Sale', 'Sale', ''],
      ['No Sale', 'No sale', ''],
    ], onSale), true));

    form.appendChild(step('s-what', 'What did they buy?',
      select('f-pt', state.data.options.pt_sale_types, 'Pick a package'), true));

    form.appendChild(step('s-why', 'Why was it a no sale?',
      select('f-why', state.data.options.no_sale_reasons, 'Pick a reason', onWhy), true));

    var otherWrap = step('s-other', 'Tell us more', textarea('f-other'), true);
    form.appendChild(otherWrap);

    form.appendChild(step('s-cancel', 'Why was it cancelled?',
      select('f-cancel', state.data.options.cancel_reasons, 'Optional'), true));

    var names = state.data.trainers && state.data.trainers.length
      ? state.data.trainers : (appt.trainer_name ? [appt.trainer_name] : []);
    form.appendChild(step('s-who', 'Who is filling this in?',
      select('f-by', names, 'Pick your name'), true));

    var errBox = el('div', 'msg err', '');
    errBox.id = 'err';
    errBox.hidden = true;
    form.appendChild(errBox);

    var btn = el('button', 'submit', 'Submit');
    btn.type = 'button';
    btn.id = 'go';
    btn.hidden = true;
    btn.onclick = submit;
    form.appendChild(btn);
  }

  function onStatus(v, btns) {
    state.status = v;
    state.outcome = null;
    press(btns, v);
    show('s-sale', v === 'completed');
    show('s-cancel', v === 'cancelled');
    show('s-what', false);
    show('s-why', false);
    show('s-other', false);
    val('f-pt', ''); val('f-why', ''); val('f-other', ''); val('f-cancel', '');
    // A no-show or a reschedule is the whole answer, so the form ends there.
    show('s-who', v !== 'completed');
    show('go', v !== 'completed');
  }

  function onSale(v, btns) {
    state.outcome = v;
    press(btns, v);
    show('s-what', v === 'Sale');
    show('s-why', v === 'No Sale');
    show('s-other', false);
    val('f-pt', ''); val('f-why', ''); val('f-other', '');
    show('s-who', true);
    show('go', true);
  }

  function onWhy() {
    show('s-other', val('f-why') === 'Other');
  }

  function submit() {
    var body = {
      appointment_id: state.appt.id,
      status: state.status,
      outcome: state.outcome,
      pt_sale_type: val('f-pt'),
      why_no_sale: val('f-why'),
      why_no_sale_other: val('f-other'),
      cancel_reason: val('f-cancel'),
      submitted_by: val('f-by'),
    };
    var btn = document.getElementById('go');
    btn.disabled = true;
    btn.textContent = 'Saving...';
    error('');
    fetch(BASE + '/api/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (!res.ok) throw new Error(res.j && res.j.error || 'Could not save');
        done();
      })
      .catch(function (e) {
        error(e.message);
        btn.disabled = false;
        btn.textContent = 'Submit';
      });
  }

  function done() {
    main.innerHTML = '';
    var box = el('div', 'card center');
    box.innerHTML = '<div class="tick" style="color:#16794c">&#10003;</div>'
      + '<div style="font-weight:700;color:#14161a;font-size:18px">Recorded</div>'
      + '<div style="margin-top:6px">Thanks. You can close this page.</div>';
    main.appendChild(box);
  }

  // --- small DOM helpers ----------------------------------------------------

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text) n.textContent = text;
    return n;
  }
  function step(id, heading, content, hidden) {
    var s = el('div', 'step');
    s.id = id;
    s.appendChild(el('h2', '', heading));
    s.appendChild(content);
    if (hidden) s.hidden = true;
    return s;
  }
  function grid(items, cb) {
    var g = el('div', 'choices' + (items.length === 2 ? ' two' : ''));
    var btns = [];
    items.forEach(function (it) {
      var b = el('button', 'choice', '');
      b.type = 'button';
      b.setAttribute('data-v', it[0]);
      b.setAttribute('aria-pressed', 'false');
      b.innerHTML = esc(it[1]) + (it[2] ? '<span class="hint">' + esc(it[2]) + '</span>' : '');
      b.onclick = function () { cb(it[0], btns); };
      btns.push(b);
      g.appendChild(b);
    });
    return g;
  }
  function press(btns, v) {
    btns.forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-v') === v)); });
  }
  function select(id, opts, placeholder, onchange) {
    var s = el('select');
    s.id = id;
    s.appendChild(new Option(placeholder, ''));
    (opts || []).forEach(function (o) { s.appendChild(new Option(o, o)); });
    if (onchange) s.onchange = onchange;
    return s;
  }
  function textarea(id) {
    var t = el('textarea');
    t.id = id;
    t.placeholder = 'A short note is plenty';
    t.maxLength = 500;
    return t;
  }
  function show(id, on) {
    var n = document.getElementById(id);
    if (n) n.hidden = !on;
  }
  function val(id, set) {
    var n = document.getElementById(id);
    if (!n) return '';
    if (set !== undefined) { n.value = set; return set; }
    return n.value || '';
  }
  function error(msg) {
    var n = document.getElementById('err');
    if (!n) return;
    n.textContent = msg || '';
    n.hidden = !msg;
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
})();
</script>
</body>
</html>
